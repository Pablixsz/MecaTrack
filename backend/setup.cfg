[mutmut]
source_paths=
    domain
    application
only_mutate=
    domain/scheduling/*
    domain/payments/*
    application/scheduling/*
    application/payments/*
also_copy=
    api
    infrastructure
    bootstrap.py
    config.py
    app.py
    tests
    pytest.ini
pytest_add_cli_args_test_selection=
    tests/unit
# test_architecture lee el codigo fuente: el instrumentado por mutmut no pasaria.
pytest_add_cli_args=
    --deselect=tests/unit/test_architecture.py
