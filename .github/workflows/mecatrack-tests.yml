name: MecaTrack - pruebas de integracion

on:
  push:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'sonar-project.properties'
      - 'scripts/export_openapi.py'
      - 'docs/openapi.json'
      - '.github/workflows/mecatrack-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'sonar-project.properties'
      - 'scripts/export_openapi.py'
      - 'docs/openapi.json'
      - '.github/workflows/mecatrack-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taller_mecanico_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      # Las pruebas usan SIEMPRE la base *_test (conftest.py aborta si no).
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/taller_mecanico_test
      # create_app() exige una URL aunque la exportacion del spec no consulte la base.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/taller_mecanico_test
      SECRET_KEY: ci-only-secret
      # Sin key del LLM a proposito: las pruebas de /api/v1/ai lo simulan (mock)
      # y nunca deben llamar al proveedor real.
      GEMINI_API_KEY: ''
      # Solo existe en el repo con SonarCloud conectado; sin el, el analisis se omite.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud necesita la historia completa para detectar el codigo nuevo.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install --only-binary :all: -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest --junitxml=pytest-report.xml --cov --cov-report=xml --cov-report=term

      - name: Validar OpenAPI y verificar que docs/openapi.json este actualizado
        run: |
          python ../scripts/export_openapi.py
          git diff --exit-code -- ../docs/openapi.json

      - name: Analisis de SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        with:
          projectBaseDir: .

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: backend/pytest-report.xml
